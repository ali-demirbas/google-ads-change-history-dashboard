name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the skill's own self-test suite
        working-directory: skills/google-ads-change-history-dashboard
        run: python3 ads_change_history.py self-test
      - name: Import check
        working-directory: skills/google-ads-change-history-dashboard
        run: python3 -c "import ads_change_history"
